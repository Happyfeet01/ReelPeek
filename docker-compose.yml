services:
  reelpeek:
    build: .
    container_name: reelpeek
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8777:8000"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    deploy:
      resources:
        limits:
          memory: 1G
