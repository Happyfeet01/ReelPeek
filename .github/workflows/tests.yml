name: Tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install web dependencies for account tests
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' jinja2 itsdangerous python-multipart
      - name: Run unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m compileall -q app
