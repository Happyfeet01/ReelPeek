<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>{% block title %}ReelPeek{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="ReelPeek Startseite">
      <span class="brand-mark">▶</span> ReelPeek
    </a>
    {% if request.state.user %}
      {% if request.state.user.id == 1 %}<a href="/admin">Konten verwalten</a>{% endif %}
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="link-button">Abmelden</button>
      </form>
    {% endif %}
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
<footer class="container"><nav aria-label="Service"><a href="/hilfe">Hilfe</a> · <a href="/datenschutz">Datenschutz</a> · <a href="/impressum">Impressum</a></nav></footer>
</body>
</html>
