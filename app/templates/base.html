<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>{% block title %}ReelPeek{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="ReelPeek Startseite">
      <span class="brand-mark">▶</span> ReelPeek
    </a>
    {% if request.session.get('authenticated') %}
      <form method="post" action="/logout"><button class="link-button">Abmelden</button></form>
    {% endif %}
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
